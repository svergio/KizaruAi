[pytest]
testpaths = tests
pythonpath = .
addopts = -ra -p no:cacheprovider
markers =
    slow: heavier smoke tests (tiny training runs on CPU); run with: python -m pytest -m slow
    integration: tests that spawn subprocesses, start a local HTTP server or use the real mlflow package
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::FutureWarning
    ignore::UserWarning
